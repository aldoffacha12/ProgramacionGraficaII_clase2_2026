<h1>Editor Circulo</h1>

<div class="panel-valores">
  <p><strong>Posicion X:</strong> {{ posicionX }}</p>
  <p><strong>Posicion Y:</strong> {{ posicionY }}</p>
  <p><strong>Tamano:</strong> {{ tamano }}</p>
  <p><strong>Color:</strong> {{ color }}</p>
  <p><strong>Visible:</strong> {{ visible }}</p>
  <p><strong>Direccion X:</strong> {{ irDerecha ? 'Derecha' : 'Izquierda' }}</p>
  <p><strong>Direccion Y:</strong> {{ irAbajo ? 'Abajo' : 'Arriba' }}</p>
</div>

<div class="lienzo">
  <div
    *ngIf="visible"
    class="circulo"
    [style.left.px]="posicionX"
    [style.top.px]="posicionY"
    [style.width.px]="tamano"
    [style.height.px]="tamano"
    [style.background]="color">
  </div>
</div>

<div class="controles">
  <h3>Ubicacion</h3>
  <button (click)="moverArriba()">^</button>
  <div>
    <button (click)="moverIzquierda()">&lt;</button>
    <button (click)="moverDerecha()">&gt;</button>
  </div>
  <button (click)="moverAbajo()">v</button>
</div>

<div class="controles">
  <h3>Diagonal</h3>
  <div>
    <button (click)="moverDiagonalArribaIzquierda()">↖</button>
    <button (click)="moverDiagonalArribaDerecha()">↗</button>
  </div>
  <div>
    <button (click)="moverDiagonalAbajoIzquierda()">↙</button>
    <button (click)="moverDiagonalAbajoDerecha()">↘</button>
  </div>
  <button (click)="cambiarDireccionX()">Cambiar X</button>
  <button (click)="cambiarDireccionY()">Cambiar Y</button>
</div>

<div class="controles">
  <h3>Tamano</h3>
  <button (click)="agrandar()">+ Agrandar</button>
  <button (click)="achicar()">- Achicar</button>
</div>

<div class="controles">
  <h3>Color</h3>
  <button (click)="cambiarColor('#ffff06')" class="amarillo"></button>
  <button (click)="cambiarColor('#00f175')" class="verde"></button>
</div>

<div class="controles">
  <h3>Visibilidad</h3>
  <button (click)="alternarVisibilidad()">
    {{ visible ? 'Ocultar' : 'Mostrar' }}
  </button>
</div>
